# SRS Configuration for LiveGo
# WebRTC + RTMP + HLS/FLV + Callbacks
# Optimized for Docker

max_connections     500;
srs_log_tank        console;
srs_log_level       trace;
srs_log_level_v2    info;
daemon              off;
in_docker           on;
empty_ip_ok         on;
pithy_print_ms      10000;
grace_start_wait    2300;
grace_final_wait    3200;
disable_daemon_for_docker on;
auto_reload_for_docker on;

# RTMP
rtmp {
    listen 1935;
    chunk_size 60000;
}

# HTTP API (WebRTC signaling and Webhooks)
http_api {
    enabled         on;
    listen          1985;
    crossdomain     on;
}

# HTTP Server (for HLS and FLV playback)
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
    crossdomain     on;
}

# WebRTC Server
rtc_server {
    enabled         on;
    listen          8000;

    # Dynamic Candidate IP setup
    candidate       127.0.0.1;
    api_as_candidates   on;
    resolve_api_domain  on;
    keep_api_domain     off;
    use_auto_detect_network_ip on;
    ip_family           ipv4;

    protocol        udp;
    ecdsa           on;
    encrypt         on;
    reuseport       1;
    merge_nalus     off;
}

vhost __defaultVhost__ {
    # HLS - 10s fragments, 60s sliding window
    hls {
        enabled             on;
        hls_path            ./objs/nginx/html;
        hls_fragment        10;
        hls_window          60;
        hls_cleanup         on;
        hls_dispose         120;
        hls_wait_keyframe   on;
        hls_recover         on;
    }

    # HTTP FLV Remuxing
    http_remux {
        enabled     on;
        mount       /live/[stream].flv;
        fast_cache  30;
    }

    # WebRTC translation to RTMP and vice-versa
    rtc {
        enabled             on;
        rtmp_to_rtc         on;
        rtc_to_rtmp         on;
    }

    # WHIP & WHEP ingestion and egress
    whip {
        enabled             on;
    }
    whep {
        enabled             on;
    }

    # Real-Time Webhooks to LiveGo backend
    # Points to backend running on the host or inside docker network
    http_hooks {
        enabled         on;
        on_publish      http://host.docker.internal:3000/api/srs/webhooks;
        on_unpublish    http://host.docker.internal:3000/api/srs/webhooks;
        on_play         http://host.docker.internal:3000/api/srs/webhooks;
        on_stop         http://host.docker.internal:3000/api/srs/webhooks;
    }
}
