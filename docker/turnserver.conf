# ==========================================
# Coturn TURN/STUN Server Configuration
# ==========================================

# Listening port for STUN/TURN (default is 3478)
listening-port=3478
tls-listening-port=5349

# Listening IP addresses (0.0.0.0 binds to all available interfaces)
listening-ip=0.0.0.0

# External IP of the TURN server. Crucial for NAT traversal.
# Configured as requested: TURN_HOST=2.25.192.154
external-ip=2.25.192.154

# Realm for authenticating users
realm=livego.store

# Long-term credentials mechanism (mandatory for WebRTC/SFU)
lt-cred-mech

# Static credentials as requested: TURN_USERNAME=livego, TURN_CREDENTIAL=livegosecretpassword
user=livego:livegosecretpassword

# Auth secret for dynamic TURN credential generation
use-auth-secret
static-auth-secret=dev_turn_secret_key_change_me

# Dynamic relay port range (opened on firewall to transmit media)
min-port=49152
max-port=65535

# Keep-alive and finger print configuration (recommended for WebRTC clients)
fingerprint
no-cli
no-tls
no-dtls

# Log configurations
verbose
log-file=stdout
