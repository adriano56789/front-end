name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build

      - name: Package and deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Clean up old backup
            rm -rf /var/www/livego.store.bak

            # Backup current version
            [ -d /var/www/livego.store/assets ] && mv /var/www/livego.store /var/www/livego.store.bak || true

            # Create fresh directory
            mkdir -p /var/www/livego.store

      - name: Upload dist via SCP (contents only)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "./dist/*"
          target: "/var/www/livego.store/"
          strip_components: 1

      - name: Reload Nginx
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo nginx -t && sudo systemctl reload nginx || sudo nginx -s reload
