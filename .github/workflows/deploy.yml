name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build

      - name: Package dist as tar.gz
        run: tar czf frontend.tar.gz -C dist .

      - name: Upload tar to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "frontend.tar.gz"
          target: "/var/www/livego.store/"

      - name: Extract and deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Enter web root
            cd /var/www/livego.store

            # Extract tar directly (creates files in place: index.html, assets/, etc.)
            tar xzf frontend.tar.gz

            # Clean up tar
            rm -f frontend.tar.gz

            # Reload Nginx
            sudo nginx -t && sudo systemctl reload nginx || sudo nginx -s reload
