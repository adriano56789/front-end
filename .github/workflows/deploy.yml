name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build

      - name: Package dist as tar.gz
        run: tar czf /tmp/frontend.tar.gz -C dist .

      - name: Upload tar to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "/tmp/frontend.tar.gz"
          target: "/tmp/"

      - name: Extract and deploy on VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            # Backup current version
            rm -rf /var/www/livego.store.bak
            [ -d /var/www/livego.store/assets ] && mv /var/www/livego.store /var/www/livego.store.bak || true

            # Create fresh directory and extract
            mkdir -p /var/www/livego.store
            tar xzf /tmp/frontend.tar.gz -C /var/www/livego.store

            # Clean up tar
            rm -f /tmp/frontend.tar.gz

            # Reload Nginx
            sudo nginx -t && sudo systemctl reload nginx || sudo nginx -s reload
