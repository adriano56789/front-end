<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="letter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#fce7f3"/>
    </linearGradient>
  </defs>

  <!-- Background circle with gradient -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Shine highlight -->
  <ellipse cx="140" cy="110" rx="160" ry="120" fill="rgba(255,255,255,0.08)"/>

  <!-- Letter L -->
  <g transform="translate(256,256)">
    <path d="M-80 -100 L-80 60 L80 60 L80 20 L-30 20 L-30 -100 Z"
          fill="url(#letter)"
          transform="scale(1.1)"/>
  </g>

  <!-- Subtle glow -->
  <rect width="512" height="512" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8"/>
</svg>
