# =============================================================================
# 🐳 LiveGo Local Stack — Configuração CORRIGIDA para Ambiente Local
# 8 Containers: MongoDB, Redis, EMQX, Backend, SRS, Coturn, LiveKit, FFmpeg
# 
# USO: docker compose -f docker-compose.local.yml up -d
# Logs: docker compose -f docker-compose.local.yml logs -f [serviço]
# Stop: docker compose -f docker-compose.local.yml down
# =============================================================================

services:

  # ═══════════════════════════════════════════════════════════════════════════
  # 1️⃣  MongoDB — Banco de dados principal
  # ═══════════════════════════════════════════════════════════════════════════
  mongodb:
    image: mongo:latest
    container_name: livego-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: adriano123
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh --quiet -u admin -p mongodb_password_change_me --authenticationDatabase admin
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - livego-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════════════════
  # 2️⃣  Redis — Cache e sessões
  # ═══════════════════════════════════════════════════════════════════════════
  redis:
    image: redis:latest
    container_name: livego-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass redis_password_change_me
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - livego-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════════════════
  # 3️⃣  EMQX — MQTT Broker (realtime messaging)
  # ═══════════════════════════════════════════════════════════════════════════
  emqx:
    image: emqx/emqx:latest
    container_name: livego-emqx
    restart: unless-stopped
    ports:
      - "1883:1883"     # MQTT TCP
      - "8083:8083"     # MQTT WebSocket
      - "8084:8084"     # MQTT WebSocket Secure
      - "8883:8883"     # MQTT SSL/TLS
      - "18083:18083"   # Dashboard (login: admin/public)
    environment:
      EMQX_NAME: livego_local
      EMQX_CLUSTER__DISCOVERY_STRATEGY: manual
      EMQX_LISTENERS__TCP__DEFAULT__BIND: 0.0.0.0:1883
      EMQX_LISTENERS__WS__DEFAULT__BIND: 0.0.0.0:8083
      EMQX_LISTENERS__WSS__DEFAULT__BIND: 0.0.0.0:8084
      EMQX_LISTENERS__SSL__DEFAULT__BIND: 0.0.0.0:8883
      EMQX_DASHBOARD__LISTENERS__HTTP__BIND: 0.0.0.0:18083
      EMQX_DASHBOARD__BOOTSTRAP_USERS_FILE: /opt/emqx/etc/bootstrap_users.txt
    volumes:
      - emqx_data:/opt/emqx/data
    healthcheck:
      test: ["CMD", "emqx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - livego-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════════════════
  # 4️⃣  Backend — API Node.js + WebSocket
  # ═══════════════════════════════════════════════════════════════════════════
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: livego-backend
    restart: unless-stopped
    ports:
      - "3000:3000"     # HTTP API
      - "3001:3001"     # WebSocket
    environment:
      # ── Environment ──
      NODE_ENV: development
      PORT: 3000
      WS_PORT: 3001
      HOST: 0.0.0.0

      # ── Database ──
      MONGODB_URI: mongodb://admin:adriano123@mongodb:27017/api?authSource=admin
      REDIS_URL: redis://:redis_password_change_me@redis:6379/0
      REDIS_ENABLED: "true"

      # ── MQTT ──
      MQTT_ENABLED: "true"
      EMQX_HOST: emqx
      EMQX_PORT: 1883
      EMQX_USERNAME: ""
      EMQX_PASSWORD: ""
      EMQX_SERVICE_TOKEN: livego_mqtt_service_token

      # ── JWT ──
      JWT_SECRET: livego_jwt_secret_development_local_change_in_prod
      JWT_REFRESH_SECRET: livego_refresh_secret_development_local_change_in_prod
      JWT_EXPIRATION: 7d
      JWT_REFRESH_EXPIRATION: 30d

      # ── URLs (Development) ──
      FRONTEND_URL: http://localhost:5173
      BACKEND_URL: http://localhost:3000
      API_BASE_URL: http://localhost:3000

      # ── SRS Streaming ──
      SRS_HOST: srs
      SRS_API_PORT: 1985
      SRS_API_URL: http://srs:1985
      SRS_RTMP_URL: rtmp://localhost:1935/live
      SRS_HTTP_URL: http://localhost:8080
      SRS_WEBRTC_URL: webrtc://localhost:8000
      SRS_WHIP_URL: http://localhost:1985/rtc/v1/whip
      SRS_WHEP_URL: http://localhost:1985/rtc/v1/whep

      # ── FFmpeg ──
      USE_DOCKER_FFMPEG: "true"
      FFMPEG_DOCKER_API: http://ffmpeg:5000

      # ── CORS (Development — permissivo) ──
      CORS_ORIGIN: "*"
      CORS_CREDENTIALS: "true"

      # ── LiveKit (container name resolution via Docker network) ──
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_ENDPOINT: http://livekit:7880
      LIVEKIT_SERVER_URL: http://livekit:7880
      LIVEKIT_API_KEY: dfd8670dd9bc2f158eb5da850fcb47778f19fc9c88ed8f76f2d1d34cd0d29c66
      LIVEKIT_API_SECRET: 8529e52ace6e923af0a1b72dffe29fc59372faa96b302c398c9142e197f7636d

      # ── TURN/STUN (coturn container name resolution) ──
      TURN_HOST: coturn
      TURN_PORT: 3478
      TURN_USERNAME: livego
      TURN_CREDENTIAL: livegosecretpassword
      TURN_SECRET: dev_turn_secret_key_change_me
      STUN_HOST: coturn
      STUN_PORT: 3478
      STUN_URL: stun:coturn:3478

      # ── Logs ──
      LOG_LEVEL: debug
      LOG_FORMAT: json

    volumes:
      - ../backend/uploads:/app/uploads
      - ../backend/logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      emqx:
        condition: service_healthy
    networks:
      - livego-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ═══════════════════════════════════════════════════════════════════════════
  # 5️⃣  SRS — Streaming Server (RTMP, WebRTC, HLS, FLV)
  # ═══════════════════════════════════════════════════════════════════════════
  srs:
    image: ossrs/srs:5
    command: ./objs/srs -c conf/srs.conf
    container_name: livego-srs
    restart: unless-stopped
    ports:
      - "1935:1935"       # RTMP
      - "1985:1985"       # HTTP API (WebRTC signaling)
      - "8080:8080"       # HTTP Server (HLS/FLV playback)
      - "8000:8000/udp"   # WebRTC media
      - "1990:1990"       # HTTPS API
      - "8088:8088"       # HTTPS Server
    volumes:
      - ./docker/srs.conf:/usr/local/srs/conf/srs.conf:ro
      - srs_objs:/usr/local/srs/objs
    environment:
      - CANDIDATE=127.0.0.1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1985/api/v1/stats"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - livego-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ═══════════════════════════════════════════════════════════════════════════
  # 6️⃣  Coturn — TURN/STUN Server (NAT traversal)
  # ═══════════════════════════════════════════════════════════════════════════
  coturn:
    image: coturn/coturn:latest
    container_name: livego-coturn
    restart: unless-stopped
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"
      - "5349:5349/udp"
      - "5349:5349/tcp"
      - "49152-65535:49152-65535/udp"
    volumes:
      - ./docker/turnserver.conf:/etc/coturn/turnserver.conf:ro
    healthcheck:
      test: ["CMD", "turnutils_uclient", "-v", "-T", "172.17.0.1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - livego-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ═══════════════════════════════════════════════════════════════════════════
  # 7️⃣  LiveKit — SFU (Selective Forwarding Unit) para salas de vídeo
  # ═══════════════════════════════════════════════════════════════════════════
  livekit:
    image: livekit/livekit-server:latest
    container_name: livego-livekit
    restart: unless-stopped
    ports:
      - "7880:7880"       # API + WebSocket
      - "7881:7881"       # TCP TURN
      - "50000-60000:50000-60000/udp"   # UDP media ports
    command: --config /etc/livekit.yaml
    volumes:
      - ./docker/livekit-server.yaml:/etc/livekit.yaml:ro
    environment:
      LIVEKIT_API_KEY: dfd8670dd9bc2f158eb5da850fcb47778f19fc9c88ed8f76f2d1d34cd0d29c66
      LIVEKIT_API_SECRET: 8529e52ace6e923af0a1b72dffe29fc59372faa96b302c398c9142e197f7636d
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7880/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      - redis
      - coturn
    networks:
      - livego-net
    extra_hosts:
      - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ═══════════════════════════════════════════════════════════════════════════
  # 8️⃣  FFmpeg Worker — Processamento de vídeo em background
  # ═══════════════════════════════════════════════════════════════════════════
  ffmpeg:
    image: node:20-alpine
    container_name: livego-ffmpeg
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ../scripts/ffmpeg-worker.js:/app/worker.js:ro
      - ../package.json:/app/package.json:ro
      - ffmpeg_cache:/tmp/ffmpeg
    working_dir: /app
    entrypoint: ["sh", "-c", "apk add --no-cache ffmpeg && node worker.js"]
    environment:
      NODE_ENV: development
      PORT: 5000
      LOG_LEVEL: debug
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - livego-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ═══════════════════════════════════════════════════════════════════════════════
# 🎛️  VOLUMES — Persistência de dados
# ═══════════════════════════════════════════════════════════════════════════════

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  redis_data:
    driver: local
  emqx_data:
    driver: local
  srs_objs:
    driver: local
  ffmpeg_cache:
    driver: local

# ═══════════════════════════════════════════════════════════════════════════════
# 🌐 NETWORKS — Comunicação entre containers
# ═══════════════════════════════════════════════════════════════════════════════

networks:
  livego-net:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br_livego_local
